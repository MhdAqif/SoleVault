{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - SoleVault</title>
  <link rel="icon" type="image/png" href="{% static 'core/images/SoleVault.png' %}" />
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  
  <style>
    :root {
      /* Dark mode colors matching SoleVault dark profile theme */
      --surface: #181c2e;
      --surface-2: #1e2235;
      --border: #2a2f45;
      --text: #ffffff;
      --text-muted: #8892b0;
      --blue: #0D59F2;
      --blue-dark: #004ee0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--surface);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      text-align: center;
    }

    .brand-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .brand-text {
      font-size: 24px;
      font-weight: 800;
      color: var(--blue);
      letter-spacing: -0.02em;
    }

    .admin-badge {
      background: var(--blue);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .login-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 25px;
    }

    .field-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .field-label {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: block;
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .field-input:focus {
      border-color: var(--blue);
    }

    .btn-login {
      width: 100%;
      padding: 12.5px;
      background-color: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14.5px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      text-align: center;
      box-shadow: 0 4px 12px rgba(13,89,242,0.2);
    }

    .btn-login:hover {
      background-color: var(--blue-dark);
    }

    .error-msg {
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 14px;
      margin-bottom: 20px;
      text-align: left;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
  </style>
</head>
<body>

<div class="auth-card">
  
  <!-- Brand -->
  <div class="brand-container" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px;">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px; height:28px;">
      <path d="M3 12h1m8-7v4M8 10.5C9 9 11 9 12 10.5M4 16c0 0 1-1.5 2.5-1.5s2 1 3.5 1s1.5-2.5 3-2.5s2.5.5 3.5 1s1.5 2 2 3s-.5 1.5-1.5 1.5s-2.5-.5-3.5-.5s-2 1-3.5 1s-3-1.5-4-2.5S5 16 4 16z"/>
    </svg>
    <span class="brand-text">SoleVault</span>
    <span class="admin-badge">Admin</span>
  </div>

  <h4 class="login-title">Admin Portal Login</h4>

  {% if error %}
  <div class="error-msg">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="{% url 'adminpanel:admin_login' %}">
    {% csrf_token %}
    
    <div class="field-group">
      <label class="field-label">Email Address</label>
      <input type="email" name="email" value="{{ request.POST.email|default:'' }}" required autofocus class="field-input">
    </div>

    <div class="field-group" style="position: relative;">
      <label class="field-label">Password</label>
      <input type="password" name="password" id="passwordInput" required class="field-input" style="padding-right: 40px;">
      <span onclick="togglePassword()" style="position: absolute; right: 14px; bottom: 12px; cursor: pointer; color: var(--text-muted); font-size: 16px; user-select: none;">👁</span>
    </div>

    <button type="submit" class="btn-login">Login to Dashboard</button>

  </form>

</div>

<script>
  function togglePassword() {
    const inp = document.getElementById('passwordInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }
</script>

</body>
</html>
