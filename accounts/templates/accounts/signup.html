{% extends 'base.html' %}
{% load static %}

{% block title %}Sign Up - SoleVault{% endblock %}

{% block content %}
<div style="background: var(--surface); min-height: 85vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
  <div class="auth-card" style="width: 100%; max-width: 480px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 40px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
    
    <h4 style="font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 25px; margin-top: 0;">Sign Up</h4>

    <form method="POST">
      {% csrf_token %}
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 18px;">
        <div style="text-align: left;">
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">First Name</label>
          <input type="text" name="first_name" value="{{ form_data.first_name|default:'' }}" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <div style="text-align: left;">
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Last Name</label>
          <input type="text" name="last_name" value="{{ form_data.last_name|default:'' }}" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
        </div>
      </div>

      <div style="text-align: left; margin-bottom: 18px;">
        <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Email Address</label>
        <input type="email" name="email" value="{{ form_data.email|default:'' }}" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>

      <div style="text-align: left; margin-bottom: 18px;">
        <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Mobile Number</label>
        <input type="tel" name="phone" value="{{ form_data.phone|default:'' }}" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 18px;">
        <div style="text-align: left;">
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Password</label>
          <input type="password" name="password" minlength="8" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
        </div>
        <div style="text-align: left;">
          <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Confirm Password</label>
          <input type="password" name="confirm_password" required style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
        </div>
      </div>

      <div style="text-align: left; margin-bottom: 18px;">
        <label style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Referral Code <span style="font-size:9.5px; color:var(--text-muted); text-transform:none;">(Optional)</span></label>
        <input type="text" name="referral" value="{{ ref_code }}" style="width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 13.5px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>

      <div style="margin-bottom: 25px; font-size: 13.5px; color: var(--text-muted); text-align: left;">
        Already have an account? <a href="{% url 'login' %}" style="color: var(--blue); text-decoration: none; font-weight: 600; transition: color 0.15s;" onmouseover="this.style.color='var(--blue-dark)'" onmouseout="this.style.color='var(--blue)'">Log in</a>
      </div>

      <button type="submit" style="width: 100%; padding: 12.5px; background-color: var(--blue); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 14.5px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; text-align: center; box-shadow: 0 4px 12px rgba(13,89,242,0.2);" onmouseover="this.style.backgroundColor='var(--blue-dark)'" onmouseout="this.style.backgroundColor='var(--blue)'">Sign Up</button>

      <div style="margin: 25px 0; display: flex; align-items: center; text-align: center; color: var(--text-muted); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">
        <span style="flex: 1; border-bottom: 1px solid var(--border); margin-right: 1em;"></span>
        Or Register With
        <span style="flex: 1; border-bottom: 1px solid var(--border); margin-left: 1em;"></span>
      </div>

      <a href="{% url 'google_login' %}" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; transition: all 0.2s;" onmouseover="this.style.background='var(--surface-2)'" onmouseout="this.style.background='var(--surface)'">
        <img src="https://img.icons8.com/color/16/google-logo.png" alt="Google">
        Google
      </a>

    </form>

    {% if messages %}
    <div style="margin-top: 20px;" class="alert-container">
      {% for message in messages %}
        <div class="alert-box" style="border-radius: 8px; font-size: 13px; font-weight: 600; padding: 10px 14px; margin-top: 10px; text-align: left;
          {% if message.tags == 'error' %}background: rgba(239, 68, 68, 0.15); color: #f87171;
          {% elif message.tags == 'success' %}background: rgba(16, 185, 129, 0.15); color: #34d399;
          {% else %}background: rgba(59, 130, 246, 0.15); color: #60a5fa;{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
    {% endif %}

  </div>
</div>

<script>
  setTimeout(() => {
    document.querySelectorAll('.alert-box').forEach(el => el.remove());
  }, 4000);
</script>
{% endblock %}
