{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - SoleVault{% endblock %}

{% block content %}
<div style="background: var(--surface); min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
  <div class="auth-card" style="width: 100%; max-width: 440px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 40px 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center;">
    
    <h4 style="font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 25px; margin-top: 0;">Reset Password</h4>

    <form method="POST">
      {% csrf_token %}
      
      <div style="text-align: left; margin-bottom: 20px;">
        <label style="font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">New Password</label>
        <input type="password" name="new_password" required style="width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>

      <div style="text-align: left; margin-bottom: 25px;">
        <label style="font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); display: block; margin-bottom: 6px;">Confirm New Password</label>
        <input type="password" name="confirm_password" required style="width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: var(--surface); color: var(--text); outline: none; transition: border-color 0.2s, background-color 0.2s;" onfocus="this.style.borderColor='var(--blue)'" onblur="this.style.borderColor='var(--border)'">
      </div>

      <button type="submit" style="width: 100%; padding: 12.5px; background-color: var(--blue); color: #fff; border: none; border-radius: 8px; font-weight: 700; font-size: 14.5px; cursor: pointer; transition: background-color 0.2s, transform 0.1s; text-align: center; box-shadow: 0 4px 12px rgba(13,89,242,0.2);" onmouseover="this.style.backgroundColor='var(--blue-dark)'" onmouseout="this.style.backgroundColor='var(--blue)'">Reset Password</button>

    </form>

    {% if messages %}
    <div style="margin-top: 20px;" class="alert-container">
      {% for message in messages %}
        <div class="alert-box" style="border-radius: 8px; font-size: 13px; font-weight: 600; padding: 10px 14px; margin-top: 10px; text-align: left;
          {% if message.tags == 'error' %}background: rgba(239, 68, 68, 0.15); color: #f87171;
          {% elif message.tags == 'success' %}background: rgba(16, 185, 129, 0.15); color: #34d399;
          {% else %}background: rgba(59, 130, 246, 0.15); color: #60a5fa;{% endif %}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
    {% endif %}

  </div>
</div>

<script>
  setTimeout(() => {
    document.querySelectorAll('.alert-box').forEach(el => el.remove());
  }, 4000);
</script>
{% endblock %}
